<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ann4 Results</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #fff; }
    h1 { color: #333; }
    p.meta { color: #666; font-size: 14px; }
    table { border-collapse: collapse; width: 100%; }
    td { border: 1px solid #ccc; padding: 12px; vertical-align: top; }
    td.page-num { width: 60px; font-weight: bold; color: #555; }
    td.img-cell { width: 40%; }
    td.img-cell img { max-width: 100%; height: auto; display: block; }
    td.ann-cell { width: 60%; font-size: 14px; line-height: 1.6; color: #222; }
    a { color: #336699; }
  </style>
</head>
<body>
  <h1>Ann4 &mdash; Annotation Results</h1>
  <p class="meta">
    File: <b>{{ filename }}</b> &nbsp;|&nbsp;
    Task: <b>{{ task }}</b> &nbsp;|&nbsp;
    Pages annotated: <b>{{ results|length }}</b> of <b>{{ total_pages }}</b>
  </p>

  <table>
    <tr>
      <td class="page-num"><b>#</b></td>
      <td class="img-cell"><b>Page image</b></td>
      <td class="ann-cell"><b>Annotation</b></td>
    </tr>
    {% for r in results %}
    <tr>
      <td class="page-num">{{ r.page }}</td>
      <td class="img-cell">
        <img src="{{ r.image_url }}" alt="Page {{ r.page }}">
      </td>
      <td class="ann-cell">{{ r.annotation }}</td>
    </tr>
    {% endfor %}
  </table>

  <p><a href="/">&#8592; Annotate another PDF</a></p>
</body>
</html>
